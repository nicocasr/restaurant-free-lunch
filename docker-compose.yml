name: alegra-lunch

# Settings every service shares: LocalStack as AWS, and the two topics (PLANNING §3.2).
x-service: &service
  restart: unless-stopped
  # Time to finish the message in hand: a long poll (5 s) plus a market purchase slice (10 s).
  stop_grace_period: 30s
  depends_on:
    localstack:
      condition: service_healthy

x-aws: &aws
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: us-east-1
  # LocalStack accepts any credentials; these are not secrets.
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:events
  SHORTAGES_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:shortages.fifo

services:
  localstack:
    # 4.14.0 is the last community edition that starts without an auth token (PLANNING §2).
    image: localstack/localstack:4.14.0
    ports:
      - '4566:4566'
    environment:
      SERVICES: dynamodb,sns,sqs
      AWS_DEFAULT_REGION: us-east-1
      # Keeps tables and queues across restarts, so the state survives like in AWS.
      PERSISTENCE: '1'
    volumes:
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'bash', '-c', 'test -f /tmp/alegra-lunch-ready']
      interval: 5s
      timeout: 3s
      retries: 30

  orders:
    <<: *service
    build: { context: ., dockerfile: services/orders/Dockerfile }
    ports:
      - '3000:3000'
    environment:
      <<: *aws
      TABLE_NAME: orders
      QUEUE_URL: http://localstack:4566/000000000000/orders
      DLQ_URL: http://localstack:4566/000000000000/orders-dlq
      PORT: '3000'
      MAX_ORDER_QUANTITY: '1000'

  kitchen:
    <<: *service
    build: { context: ., dockerfile: services/kitchen/Dockerfile }
    ports:
      - '3002:3002'
    environment:
      <<: *aws
      TABLE_NAME: kitchen
      QUEUE_URL: http://localstack:4566/000000000000/kitchen
      DLQ_URL: http://localstack:4566/000000000000/kitchen-dlq
      PORT: '3002'

  warehouse:
    <<: *service
    build: { context: ., dockerfile: services/warehouse/Dockerfile }
    ports:
      - '3001:3001'
    environment:
      <<: *aws
      TABLE_NAME: warehouse
      QUEUE_URL: http://localstack:4566/000000000000/warehouse
      DLQ_URL: http://localstack:4566/000000000000/warehouse-dlq
      PORT: '3001'

  market:
    <<: *service
    build: { context: ., dockerfile: services/market/Dockerfile }
    ports:
      - '3003:3003'
    environment:
      <<: *aws
      TABLE_NAME: purchases
      QUEUE_URL: http://localstack:4566/000000000000/market.fifo
      DLQ_URL: http://localstack:4566/000000000000/market-dlq.fifo
      PORT: '3003'
      FARMERS_MARKET_URL: https://recruitment.alegra.com/api/farmers-market

  realtime:
    <<: *service
    build: { context: ., dockerfile: services/realtime/Dockerfile }
    ports:
      - '3004:3004'
    environment:
      <<: *aws
      QUEUE_URL: http://localstack:4566/000000000000/realtime
      DLQ_URL: http://localstack:4566/000000000000/realtime-dlq
      PORT: '3004'

  assistant:
    <<: *service
    build: { context: ., dockerfile: services/assistant/Dockerfile }
    ports:
      - '3005:3005'
    environment:
      <<: *aws
      TABLE_NAME: assistant
      PORT: '3005'
      ORDERS_URL: http://orders:3000
      WAREHOUSE_URL: http://warehouse:3001
      MARKET_URL: http://market:3003
      KITCHEN_URL: http://kitchen:3002
      # Read from the .env file at the root, which Git ignores. Without it the assistant
      # answers that it is not configured, and everything else works the same.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  # The dashboard: open http://localhost:8080
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports:
      - '8080:80'
    depends_on:
      - orders
      - realtime
      - assistant

volumes:
  localstack-data:
