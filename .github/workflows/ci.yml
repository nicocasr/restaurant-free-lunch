name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Adapters against real AWS emulators: LocalStack with the tables, topics and queues.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: docker compose up -d --wait
      - run: npm ci
      - run: npm run test:integration

      # The whole flow on the running containers, buying from the real farmers market.
      - run: npm run e2e

      - if: failure()
        run: docker compose logs
