# Realtime in AWS (PLANNING §2): API Gateway WebSocket keeps the dashboard sockets, a table
# remembers who is connected, and a queue gathers the events to push them in batches.
service: alegra-lunch-realtime
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  # Graviton: about 20% cheaper per millisecond than x86.
  architecture: arm64
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 7
  # The dashboard only listens: with no $default route, a message it sends invokes nothing.
  websocketsApiName: alegra-lunch-${sls:stage}-realtime
  environment:
    NODE_OPTIONS: --enable-source-maps
    TABLE_NAME: !Ref ConnectionsTable
    WEBSOCKET_MANAGEMENT_URL: !Join
      - ''
      - - https://
        - !Ref WebsocketsApi
        - .execute-api.${aws:region}.amazonaws.com/${sls:stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource: !GetAtt ConnectionsTable.Arn
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource: !Join
            - ''
            - - 'arn:aws:execute-api:${aws:region}:${aws:accountId}:'
              - !Ref WebsocketsApi
              - /${sls:stage}/POST/@connections/*

build:
  esbuild:
    bundle: true
    sourcemap: true

functions:
  connect:
    handler: src/entrypoints/lambda/handlers.connect
    # A cap, free unlike provisioned concurrency: an abuse never burns the credits (§2).
    reservedConcurrency: 10
    events:
      - websocket: $connect
  disconnect:
    handler: src/entrypoints/lambda/handlers.disconnect
    # A cap, free unlike provisioned concurrency: an abuse never burns the credits (§2).
    reservedConcurrency: 10
    events:
      - websocket: $disconnect
  queue:
    handler: src/entrypoints/lambda/handlers.queue
    # A cap, free unlike provisioned concurrency: an abuse never burns the credits (§2).
    reservedConcurrency: 10
    events:
      - sqs:
          arn: !GetAtt RealtimeQueue.Arn
          # Up to 10 events per push and no batching window: with a window, the last events of
          # a burst waited ~20 s for the next poll of a quiet queue (PLANNING §2).
          batchSize: 10
          # As many Lambdas as the function reserves.
          maximumConcurrency: 10

resources:
  Resources:
    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: alegra-lunch-${sls:stage}-connections
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }

    # Delivery to the dashboard is best effort: it reloads its data when it reconnects. So a
    # batch that keeps failing goes to the DLQ after 3 tries instead of retrying forever.
    RealtimeDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: alegra-lunch-${sls:stage}-realtime-dlq
        MessageRetentionPeriod: 1209600

    # An old event is useless to a live dashboard, so the queue keeps them only 5 minutes.
    # Twice the Lambda timeout, not the six times AWS suggests: a message the poller took but
    # could not hand over waits for this before it returns, and 60 s stalled a whole batch.
    RealtimeQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: alegra-lunch-${sls:stage}-realtime
        VisibilityTimeout: 20
        MessageRetentionPeriod: 300
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt RealtimeDlq.Arn
          maxReceiveCount: 3

    RealtimeQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref RealtimeQueue]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt RealtimeQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn:
                    - ${cf:alegra-lunch-infra-${sls:stage}.EventsTopicArn}
                    - ${cf:alegra-lunch-infra-${sls:stage}.ShortagesTopicArn}

    RealtimeEventsSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:alegra-lunch-infra-${sls:stage}.EventsTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt RealtimeQueue.Arn
        RawMessageDelivery: true
        FilterPolicy:
          type:
            - WorkdayStarted
            - OrderPlaced
            - IngredientsRequested
            - OrderWaitingIngredients
            - IngredientsReserved
            - IngredientPurchased
            - OrderDelivered

    RealtimeShortagesSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:alegra-lunch-infra-${sls:stage}.ShortagesTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt RealtimeQueue.Arn
        RawMessageDelivery: true
        FilterPolicy:
          type: [StockShortage]
