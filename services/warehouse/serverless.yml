# Warehouse in AWS (PLANNING §2): its table, its queue subscribed to the events it consumes,
# and its Lambdas. The topics and the HTTP API come from the shared stack (infra/aws).
service: alegra-lunch-warehouse
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  # Graviton: about 20% cheaper per millisecond than x86.
  architecture: arm64
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 7
  httpApi:
    id: ${cf:alegra-lunch-infra-${sls:stage}.HttpApiId}
  environment:
    NODE_OPTIONS: --enable-source-maps
    TABLE_NAME: !Ref WarehouseTable
    DLQ_URL: !Ref WarehouseDlq
    EVENTS_TOPIC_ARN: ${cf:alegra-lunch-infra-${sls:stage}.EventsTopicArn}
    SHORTAGES_TOPIC_ARN: ${cf:alegra-lunch-infra-${sls:stage}.ShortagesTopicArn}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:ConditionCheckItem
          Resource: !GetAtt WarehouseTable.Arn
        - Effect: Allow
          Action: sns:Publish
          Resource:
            - ${cf:alegra-lunch-infra-${sls:stage}.EventsTopicArn}
            - ${cf:alegra-lunch-infra-${sls:stage}.ShortagesTopicArn}
        - Effect: Allow
          Action: sqs:ChangeMessageVisibility
          Resource: !GetAtt WarehouseQueue.Arn
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt WarehouseDlq.Arn

build:
  esbuild:
    bundle: true
    sourcemap: true

functions:
  queue:
    handler: src/entrypoints/lambda/handlers.queue
    # A cap, free unlike provisioned concurrency: an abuse never burns the credits (§2).
    reservedConcurrency: 10
    events:
      - sqs:
          arn: !GetAtt WarehouseQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
          # As many Lambdas as the function reserves.
          maximumConcurrency: 10
  http:
    handler: src/entrypoints/lambda/handlers.http
    # A cap, free unlike provisioned concurrency: an abuse never burns the credits (§2).
    reservedConcurrency: 10
    events:
      - httpApi: GET /inventory

resources:
  Resources:
    WarehouseTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: alegra-lunch-${sls:stage}-warehouse
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }

    # Only invalid messages land here, sent by the handler; failures retry on the queue (§3.8).
    WarehouseDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: alegra-lunch-${sls:stage}-warehouse-dlq
        MessageRetentionPeriod: 1209600

    # Six times the Lambda timeout, as AWS recommends for queues that trigger a Lambda.
    WarehouseQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: alegra-lunch-${sls:stage}-warehouse
        VisibilityTimeout: 60

    WarehouseQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref WarehouseQueue]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt WarehouseQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:alegra-lunch-infra-${sls:stage}.EventsTopicArn}

    WarehouseSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:alegra-lunch-infra-${sls:stage}.EventsTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt WarehouseQueue.Arn
        RawMessageDelivery: true
        FilterPolicy:
          type: [WorkdayStarted, IngredientsRequested, IngredientPurchased]
